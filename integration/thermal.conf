local data = assert(os.getenv('XDG_RUNTIME_DIR')) .. '/thermal-desktop'

conky.config = {
    out_to_x = true,
    out_to_wayland = false,
    background = false,
    update_interval = 2,
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans:size=9',
    default_color = 'E5E9F0',
    color1 = '78C5F5',
    color2 = 'E6BE83',
    color3 = 'A5AEC0',
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 52,
    minimum_width = 256,
    maximum_width = 256,
    border_inner_margin = 12,
    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'Thermal Monitor',
    own_window_class = 'ThermalMonitor',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_transparent = false,
    own_window_colour = '111827',
    draw_shades = false,
    draw_outline = false,
    draw_graph_borders = false,
    show_graph_scale = false,
    show_graph_range = false,
    no_buffers = true,
    cpu_avg_samples = 2,
};

conky.text = ([[
${font DejaVu Sans:bold:size=10}Thermal Monitor${font}
${color1}Usage${alignr}${color2}Temperature${color}
${voffset 6}CPU  ${cpu cpu0}%${alignr}${head @DATA@/cpu_label 1 2}
${cpugraph cpu0 24,116 345777 78C5F5 -t}${goto 152}${if_match ${head @DATA@/cpu_valid 1 2} == 1}${execigraph 5 "cat @DATA@/cpu_temp" 24,116 766344 E6BE83 110}${else}${color3}N/A${color}${endif}
${voffset 4}GPU  ${head @DATA@/gpu_load_label 1 2}${alignr}${head @DATA@/gpu_temp_label 1 2}
${if_match ${head @DATA@/gpu_load_valid 1 2} == 0}${if_match ${head @DATA@/gpu_valid 1 2} == 0}${voffset 24}${endif}${endif}${if_match ${head @DATA@/gpu_load_valid 1 2} == 1}${execigraph 5 "cat @DATA@/gpu_load" 24,116 345777 78C5F5 100}${else}${color3}N/A${color}${endif}${goto 152}${if_match ${head @DATA@/gpu_valid 1 2} == 1}${execigraph 5 "cat @DATA@/gpu_temp" 24,116 766344 E6BE83 110}${else}${color3}N/A${color}${endif}
${voffset 8}VRAM${alignr}${head @DATA@/vram_label 1 2}
${color1}${if_match ${head @DATA@/vram_valid 1 2} == 1}${execibar 5 3,256 cat @DATA@/vram_percent}${else}${color3}N/A${endif}${color}
RAM  ${memperc}%${alignr}${mem} / ${memmax}
${color1}${membar 3,256}${color}
${voffset 6}${color3}${head @DATA@/extra 1 2}
${head @DATA@/fans 1 2}
${head @DATA@/disks 1 2}
${voffset 6}5s sensors · 7-day logs${color}
]]):gsub('@DATA@', data)
