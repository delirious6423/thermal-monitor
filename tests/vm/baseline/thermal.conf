conky.config = {
    out_to_x = true,
    out_to_wayland = false,
    background = false,
    update_interval = 2,
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    default_color = 'E5E9F0',
    color1 = '78C5F5',
    color2 = '8FDFB0',
    color3 = 'A5AEC0',
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 52,
    minimum_width = 304,
    maximum_width = 304,
    border_inner_margin = 16,
    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'Thermal Monitor',
    own_window_class = 'ThermalMonitor',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_transparent = false,
    own_window_colour = '111827',
    draw_shades = false,
    draw_outline = false,
    draw_graph_borders = false,
    show_graph_scale = false,
    show_graph_range = false,
    no_buffers = true,
    cpu_avg_samples = 2,
};

conky.text = [[
${font DejaVu Sans Mono:bold:size=12}THERMAL MONITOR${font}
${color3}Live desktop readings${color}

${color1}CPU${color}  ${cpu cpu0}% ${alignr}${head /run/user/1000/thermal-desktop/cpu_label 1 2}
${cpugraph cpu0 38,304 345777 78C5F5 -t}
${color3}CPU temperature${color}
${execigraph 5 "cat /run/user/1000/thermal-desktop/cpu_temp" 30,304 345777 78C5F5 110}

${color2}RTX 4090${color} ${alignr}${head /run/user/1000/thermal-desktop/gpu_label 1 2}
${execigraph 5 "cat /run/user/1000/thermal-desktop/gpu_load" 38,304 35634D 8FDFB0 100}
${color3}GPU temperature${color}
${execigraph 5 "cat /run/user/1000/thermal-desktop/gpu_temp" 30,304 35634D 8FDFB0 110}
${head /run/user/1000/thermal-desktop/extra 1 2}

${color3}COOLING & STORAGE${color}
${head /run/user/1000/thermal-desktop/fans 1 2}
${head /run/user/1000/thermal-desktop/ssd1 1 2}
${head /run/user/1000/thermal-desktop/ssd2 1 2}

RAM  ${memperc}%  ${alignr}${mem} / ${memmax}
${color3}Sensors: 5s · History: 7 days${color}
]];
